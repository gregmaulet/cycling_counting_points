    const years = ["2022", "2023", "2024", "2025", "2026"];
    const yearColors = {
      2022: "#64748b",
      2023: "#0891b2",
      2024: "#16a34a",
      2025: "#f59e0b",
      2026: "#dc2626"
    };
    const activeYears = new Set(years);

    if (!window.L) {
      const status = document.querySelector("#map-status");
      status.style.display = "block";
      status.textContent = "The map library did not load. Check your internet connection or rerun this page where unpkg.com is reachable.";
      throw new Error("Leaflet failed to load");
    }

    const map = L.map("map", { scrollWheelZoom: true }).setView([46.1843756, 6.2776917], 12);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);

    const markers = locations.map((location) => {
      const latestYear = location.years[location.years.length - 1] || "2026";
      const marker = L.marker([location.latitude, location.longitude], {
        icon: L.divIcon({
          className: "",
          html: `<div class="point-marker" style="background:${yearColors[latestYear]}">${location.years.length}</div>`,
          iconSize: [24, 24],
          iconAnchor: [12, 12],
          popupAnchor: [0, -12]
        })
      }).bindPopup(location.popup);
      marker.locationYears = location.years;
      marker.addTo(map);
      return marker;
    });

    if (markers.length > 0) {
      const bounds = L.latLngBounds(markers.map((marker) => marker.getLatLng()));
      map.fitBounds(bounds, { padding: [28, 28] });
    }

    const filters = document.querySelector("#filters");
    years.forEach((year) => {
      const label = document.createElement("label");
      label.innerHTML = `<input type="checkbox" value="${year}" checked> ${year}`;
      filters.appendChild(label);
    });

    filters.addEventListener("change", (event) => {
      if (event.target.checked) {
        activeYears.add(event.target.value);
      } else {
        activeYears.delete(event.target.value);
      }
      updateMarkers();
    });

    function updateMarkers() {
      let visibleCount = 0;
      markers.forEach((marker) => {
        const isVisible = marker.locationYears.some((year) => activeYears.has(year));
        if (isVisible) {
          if (!map.hasLayer(marker)) {
            marker.addTo(map);
          }
          visibleCount += 1;
        } else if (map.hasLayer(marker)) {
          marker.remove();
        }
      });
      document.querySelector("#visible-count").textContent = visibleCount;
    }
